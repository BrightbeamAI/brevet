# Task families under Brevet governance in your Claude sessions.
#
# Capture is always on under your standing consent: at the end of any
# task you correct or approve, Claude records the draft/final pair as
# evidence here, without being asked. Families are the clustering key
# for mining, so granularity matters: too broad and unrelated
# corrections mix; too narrow and recurrence never reaches the
# proposal threshold (3).
#
# `assistant_conduct` and `general` are the always-on defaults and
# should stay. Add your own families for recurring work.

families:
  assistant_conduct:
    description: Standing rules about how Claude works (style, tone, conventions)
  general:
    description: Any task where you correct or approve Claude's output
  weekly_summary:
    description: Weekly status or team summaries you ship regularly
  email_draft:
    description: Correspondence Claude drafts for you to send
  document_review:
    description: Review notes and feedback passes on documents
