[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brevet"
version = "0.4.0"
description = "Change control for what AI agents learn: corrections become proposed rules, a named person approves each one, approved rules ship in signed versions, and any rule can be withdrawn. Wraps the agent framework you already use."
# PyPI gets README_PYPI.md: README.md with links and figures made absolute and
# pinned to the release tag (scripts/make_pypi_readme.py writes it).
readme = "README_PYPI.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Brightbeam AI", email = "oss@brightbeam.com" }]
keywords = ["agents", "governance", "change-control", "self-evolving", "harness", "mcp", "chap", "metis", "audit", "capability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.5",
  "typer>=0.9",
  "PyYAML>=6.0",
  "cryptography>=41.0",
  # The MCP SDK is a core dependency so `uvx brevet mcp` works with nothing
  # installed first.
  "mcp>=1.10,<3",
]

[project.optional-dependencies]
# The official CHAP Python coordinator, from PyPI.
chap = ["chap-coordinator>=0.2.8"]
# Kept so that "brevet[mcp]" still installs; the SDK is now a core dependency.
mcp = ["mcp>=1.10,<3"]
# Passphrase-protected SSH keys as approver keys (brevet approver add --ssh-key).
ssh = ["bcrypt>=4"]
dev = ["pytest>=7", "ruff>=0.16,<0.17", "jsonschema>=4", "mcp>=1.10,<3",
       "chap-coordinator>=0.2.8", "bcrypt>=4", "build>=1", "twine>=5"]

[project.scripts]
brevet = "brevet.cli:main"

[project.urls]
Homepage = "https://github.com/BrightbeamAI/brevet"
Repository = "https://github.com/BrightbeamAI/brevet"
Documentation = "https://github.com/BrightbeamAI/brevet/blob/main/ABOUT.md"
Changelog = "https://github.com/BrightbeamAI/brevet/blob/main/CHANGELOG.md"
Issues = "https://github.com/BrightbeamAI/brevet/issues"
"CHAP protocol" = "https://github.com/BrightbeamAI/chap"
"Metis memory" = "https://github.com/BrightbeamAI/metis"

[tool.setuptools.packages.find]
include = ["brevet*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
