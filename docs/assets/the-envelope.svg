<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9900"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" rx="18" fill="#1B1C1E" stroke="#3A3C40"/>

  <text x="48" y="54" font-size="27" font-weight="bold" fill="#F5F5F5">Wrap the agent you already have</text>
  <text x="48" y="81" font-size="15.5" fill="#B3B8BF">brevet.wrap() builds governance around your framework. It never reaches inside.</text>

  <!-- wrap() entry -->
  <rect x="36" y="272" width="160" height="46" rx="10" fill="#242528" stroke="#FF9900" stroke-width="1.5"/>
  <text x="116" y="300" font-family="Consolas, Menlo, monospace" font-size="15" fill="#FF9900" text-anchor="middle">brevet.wrap()</text>
  <line x1="196" y1="295" x2="240" y2="295" stroke="#FF9900" stroke-width="2.5" marker-end="url(#ea)"/>

  <!-- ================= the envelope ================= -->
  <rect x="246" y="128" width="706" height="384" rx="20" fill="#242528" stroke="#EA4700" stroke-width="2.5"/>
  <text x="599" y="176" font-size="13.5" font-weight="bold" fill="#FF7A45" text-anchor="middle" letter-spacing="3">THE BREVET ENVELOPE</text>

  <!-- port tabs sitting on the border -->
  <g>
    <rect x="286" y="106" width="200" height="44" rx="10" fill="#2C2D31" stroke="#FF9900" stroke-width="1.5"/>
    <text x="386" y="125" font-size="14.5" font-weight="bold" fill="#FF9900" text-anchor="middle">signed manifest</text>
    <text x="386" y="142" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#B3B8BF" text-anchor="middle">agent.yaml, harness as data</text>

    <rect x="712" y="106" width="200" height="44" rx="10" fill="#2C2D31" stroke="#FF9900" stroke-width="1.5"/>
    <text x="812" y="125" font-size="14.5" font-weight="bold" fill="#FF9900" text-anchor="middle">evidence ledger</text>
    <text x="812" y="142" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#B3B8BF" text-anchor="middle">hash-linked, replayable</text>

    <rect x="286" y="490" width="200" height="44" rx="10" fill="#2C2D31" stroke="#FF9900" stroke-width="1.5"/>
    <text x="386" y="509" font-size="14.5" font-weight="bold" fill="#FF9900" text-anchor="middle">dawn gate + evals</text>
    <text x="386" y="526" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#B3B8BF" text-anchor="middle">humans promote, gates block</text>

    <rect x="712" y="490" width="200" height="44" rx="10" fill="#2C2D31" stroke="#FF9900" stroke-width="1.5"/>
    <text x="812" y="509" font-size="14.5" font-weight="bold" fill="#FF9900" text-anchor="middle">lock + recall</text>
    <text x="812" y="526" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#B3B8BF" text-anchor="middle">learned BOM, un-learning</text>
  </g>

  <!-- inner agent box -->
  <rect x="336" y="196" width="526" height="176" rx="14" fill="#1B1C1E" stroke="#4A4D52" stroke-width="1.5"/>
  <text x="599" y="234" font-size="19" font-weight="bold" fill="#F5F5F5" text-anchor="middle" letter-spacing="0.5">YOUR AGENT, UNCHANGED</text>
  <g font-size="13" fill="#1B1C1E" font-weight="bold">
    <rect x="374" y="254" width="92" height="27" rx="13.5" fill="#C9CDD3"/><text x="420" y="272" text-anchor="middle">LangGraph</text>
    <rect x="474" y="254" width="100" height="27" rx="13.5" fill="#C9CDD3"/><text x="524" y="272" text-anchor="middle">Claude SDK</text>
    <rect x="582" y="254" width="76" height="27" rx="13.5" fill="#C9CDD3"/><text x="620" y="272" text-anchor="middle">CrewAI</text>
    <rect x="666" y="254" width="86" height="27" rx="13.5" fill="#C9CDD3"/><text x="709" y="272" text-anchor="middle">AutoGen</text>
    <rect x="760" y="254" width="64" height="27" rx="13.5" fill="#FF9900"/><text x="792" y="272" text-anchor="middle">+6</text>
  </g>
  <text x="599" y="312" font-size="14.5" fill="#B3B8BF" text-anchor="middle">auto-detected · duck-typed · your framework keeps executing</text>
  <text x="599" y="348" font-size="13.5" fill="#8A8F98" text-anchor="middle">a custom framework binds with one adapter class</text>

  <!-- lifecycle strip inside the envelope -->
  <text x="599" y="416" font-size="13" font-weight="bold" fill="#8A8F98" text-anchor="middle" letter-spacing="2">ONE OBJECT, THE WHOLE LIFECYCLE</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#E7E9EC">
    <rect x="286" y="430" width="60" height="28" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="316" y="449" text-anchor="middle">run</text>
    <rect x="354" y="430" width="112" height="28" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="410" y="449" text-anchor="middle">record_final</text>
    <rect x="474" y="430" width="66" height="28" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="507" y="449" text-anchor="middle">dream</text>
    <rect x="548" y="430" width="60" height="28" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="578" y="449" text-anchor="middle">dawn</text>
    <rect x="616" y="430" width="88" height="28" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="660" y="449" text-anchor="middle">evaluate</text>
    <rect x="712" y="430" width="76" height="28" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="750" y="449" text-anchor="middle">release</text>
    <rect x="796" y="430" width="68" height="28" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="830" y="449" text-anchor="middle">recall</text>
    <rect x="872" y="430" width="68" height="28" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="906" y="449" text-anchor="middle">verify</text>
  </g>
</svg>
