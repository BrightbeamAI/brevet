<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9900"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" rx="18" fill="#1B1C1E" stroke="#3A3C40"/>

  <text x="48" y="56" font-size="28" font-weight="bold" fill="#F5F5F5">Wrap the agent you already have</text>
  <text x="48" y="84" font-size="16.5" fill="#B3B8BF">brevet.wrap() builds governance around your framework. It never reaches inside.</text>

  <!-- wrap() entry -->
  <rect x="30" y="272" width="176" height="48" rx="10" fill="#242528" stroke="#FF9900" stroke-width="1.5"/>
  <text x="118" y="302" font-family="Consolas, Menlo, monospace" font-size="15.5" fill="#FF9900" text-anchor="middle">brevet.wrap()</text>
  <line x1="206" y1="296" x2="242" y2="296" stroke="#FF9900" stroke-width="2.5" marker-end="url(#ea)"/>

  <!-- ================= the envelope ================= -->
  <rect x="248" y="130" width="704" height="382" rx="20" fill="#242528" stroke="#EA4700" stroke-width="2.5"/>
  <text x="600" y="182" font-size="14.5" font-weight="bold" fill="#FF7A45" text-anchor="middle" letter-spacing="3">THE BREVET ENVELOPE</text>

  <!-- port tabs sitting on the border -->
  <g>
    <rect x="276" y="106" width="216" height="48" rx="10" fill="#2C2D31" stroke="#FF9900" stroke-width="1.5"/>
    <text x="384" y="127" font-size="16" font-weight="bold" fill="#FF9900" text-anchor="middle">signed manifest</text>
    <text x="384" y="146" font-family="Consolas, Menlo, monospace" font-size="13" fill="#B3B8BF" text-anchor="middle">the harness as data</text>

    <rect x="708" y="106" width="216" height="48" rx="10" fill="#2C2D31" stroke="#FF9900" stroke-width="1.5"/>
    <text x="816" y="127" font-size="16" font-weight="bold" fill="#FF9900" text-anchor="middle">evidence ledger</text>
    <text x="816" y="146" font-family="Consolas, Menlo, monospace" font-size="13" fill="#B3B8BF" text-anchor="middle">hash-linked, replayable</text>

    <rect x="276" y="488" width="216" height="48" rx="10" fill="#2C2D31" stroke="#FF9900" stroke-width="1.5"/>
    <text x="384" y="509" font-size="16" font-weight="bold" fill="#FF9900" text-anchor="middle">dawn gate + evals</text>
    <text x="384" y="528" font-family="Consolas, Menlo, monospace" font-size="13" fill="#B3B8BF" text-anchor="middle">human gate, strict evals</text>

    <rect x="708" y="488" width="216" height="48" rx="10" fill="#2C2D31" stroke="#FF9900" stroke-width="1.5"/>
    <text x="816" y="509" font-size="16" font-weight="bold" fill="#FF9900" text-anchor="middle">lock + recall</text>
    <text x="816" y="528" font-family="Consolas, Menlo, monospace" font-size="13" fill="#B3B8BF" text-anchor="middle">learned BOM, un-learning</text>
  </g>

  <!-- inner agent box -->
  <rect x="304" y="202" width="592" height="180" rx="14" fill="#1B1C1E" stroke="#4A4D52" stroke-width="1.5"/>
  <text x="600" y="242" font-size="21" font-weight="bold" fill="#F5F5F5" text-anchor="middle" letter-spacing="0.5">YOUR AGENT, UNCHANGED</text>
  <g font-size="14" fill="#1B1C1E" font-weight="bold">
    <rect x="336" y="262" width="104" height="30" rx="15" fill="#C9CDD3"/><text x="388" y="282" text-anchor="middle">LangGraph</text>
    <rect x="448" y="262" width="112" height="30" rx="15" fill="#C9CDD3"/><text x="504" y="282" text-anchor="middle">Claude SDK</text>
    <rect x="568" y="262" width="84" height="30" rx="15" fill="#C9CDD3"/><text x="610" y="282" text-anchor="middle">CrewAI</text>
    <rect x="660" y="262" width="96" height="30" rx="15" fill="#C9CDD3"/><text x="708" y="282" text-anchor="middle">AutoGen</text>
    <rect x="764" y="262" width="60" height="30" rx="15" fill="#FF9900"/><text x="794" y="282" text-anchor="middle">+6</text>
  </g>
  <text x="600" y="326" font-size="15.5" fill="#B3B8BF" text-anchor="middle">auto-detected · duck-typed · your framework keeps executing</text>
  <text x="600" y="360" font-size="14.5" fill="#8A8F98" text-anchor="middle">a custom framework binds with one adapter class</text>

  <!-- lifecycle strip inside the envelope -->
  <text x="600" y="424" font-size="14" font-weight="bold" fill="#8A8F98" text-anchor="middle" letter-spacing="2">ONE OBJECT, THE WHOLE LIFECYCLE</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#E7E9EC">
    <rect x="284" y="438" width="54" height="30" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="311" y="458" text-anchor="middle">run</text>
    <rect x="346" y="438" width="118" height="30" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="405" y="458" text-anchor="middle">record_final</text>
    <rect x="472" y="438" width="62" height="30" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="503" y="458" text-anchor="middle">dream</text>
    <rect x="542" y="438" width="54" height="30" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="569" y="458" text-anchor="middle">dawn</text>
    <rect x="604" y="438" width="86" height="30" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="647" y="458" text-anchor="middle">evaluate</text>
    <rect x="698" y="438" width="78" height="30" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="737" y="458" text-anchor="middle">release</text>
    <rect x="784" y="438" width="62" height="30" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="815" y="458" text-anchor="middle">recall</text>
    <rect x="854" y="438" width="62" height="30" rx="8" fill="#2C2D31" stroke="#3A3C40"/><text x="885" y="458" text-anchor="middle">verify</text>
  </g>
</svg>
