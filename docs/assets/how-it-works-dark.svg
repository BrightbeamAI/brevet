<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 912" width="1200" height="912" role="img" aria-label="The governed evolution loop: work, override, dream, dawn, evals, release, and recall"><title>The governed evolution loop: work, override, dream, dawn, evals, release, and recall</title><rect x="1" y="1" width="1198" height="910" rx="22" fill="#16181B" stroke="#383C43" stroke-width="1.5"/><text x="56" y="72" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">The governed evolution loop</text><text x="56" y="108" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19" fill="#C3C9D1" text-anchor="start">Experts' corrections become overrides, overrides become candidates, and only a named human can promote one.</text><rect x="48" y="156" width="340" height="236" rx="16" fill="#1F2125" stroke="#383C43" stroke-width="1.5"/><circle cx="86" cy="200" r="18" fill="#4FD486"/><text x="86" y="206.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18" font-weight="700" fill="#16181B" text-anchor="middle">1</text><text x="118" y="208" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">Work</text><g transform="translate(330,180) scale(1.05)" fill="none" stroke="#4FD486" stroke-width="2.48" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="12" width="22" height="17" rx="5"/><line x1="18" y1="5" x2="18" y2="12"/><circle cx="18" cy="4" r="2"/><circle cx="13.5" cy="20.5" r="2" fill="#4FD486" stroke="none"/><circle cx="22.5" cy="20.5" r="2" fill="#4FD486" stroke="none"/></g><text x="78" y="260" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">The agent drafts its work under</text><text x="78" y="288" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">one signed harness. An expert</text><text x="78" y="316" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">checks each draft.</text><rect x="78" y="342" width="123.34375" height="30" rx="15.0" fill="#2C3036"/><text x="90" y="362.4" font-family="Menlo, Consolas, &apos;DejaVu Sans Mono&apos;, monospace" font-size="15" fill="#E6E9ED" text-anchor="start">agent.run()</text><rect x="434" y="156" width="340" height="236" rx="16" fill="#1F2125" stroke="#383C43" stroke-width="1.5"/><circle cx="472" cy="200" r="18" fill="#93B6F2"/><text x="472" y="206.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18" font-weight="700" fill="#16181B" text-anchor="middle">2</text><text x="504" y="208" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">Override</text><g transform="translate(716,180) scale(1.05)" fill="none" stroke="#93B6F2" stroke-width="2.48" stroke-linecap="round" stroke-linejoin="round"><path d="M8 28 L10 21 L24 7 L29 12 L15 26 Z"/><path d="M21 10 L26 15"/></g><text x="464" y="260" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">The expert corrects the draft.</text><text x="464" y="288" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">Brevet records the change and</text><text x="464" y="316" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">the reason as an override.</text><rect x="464" y="342" width="204.625" height="30" rx="15.0" fill="#2C3036"/><text x="476" y="362.4" font-family="Menlo, Consolas, &apos;DejaVu Sans Mono&apos;, monospace" font-size="15" fill="#E6E9ED" text-anchor="start">agent.record_final()</text><rect x="820" y="156" width="340" height="236" rx="16" fill="#1F2125" stroke="#383C43" stroke-width="1.5"/><circle cx="858" cy="200" r="18" fill="#BB9AF0"/><text x="858" y="206.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18" font-weight="700" fill="#16181B" text-anchor="middle">3</text><text x="890" y="208" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">Dream</text><g transform="translate(1102,180) scale(1.05)" fill="none" stroke="#BB9AF0" stroke-width="2.48" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="15" r="9"/><path d="M22 22 L30 30"/><path d="M11 15 h8 M15 11 v8"/></g><text x="850" y="260" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">Offline, recurring overrides</text><text x="850" y="288" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">become candidate capabilities,</text><text x="850" y="316" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">with no authority yet.</text><rect x="850" y="342" width="141.40625" height="30" rx="15.0" fill="#2C3036"/><text x="862" y="362.4" font-family="Menlo, Consolas, &apos;DejaVu Sans Mono&apos;, monospace" font-size="15" fill="#E6E9ED" text-anchor="start">agent.dream()</text><rect x="820" y="474" width="340" height="236" rx="16" fill="#2D1D17" stroke="#EA4700" stroke-width="2.6"/><circle cx="858" cy="518" r="18" fill="#EA4700"/><text x="858" y="524.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18" font-weight="700" fill="#16181B" text-anchor="middle">4</text><text x="890" y="526" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">Dawn</text><g transform="translate(1102,498) scale(1.05)" fill="none" stroke="#EA4700" stroke-width="2.48" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="13"/><path d="M11.5 18.5 L16 23 L25 13"/></g><text x="850" y="578" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">A named human or mission</text><text x="850" y="606" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">group promotes, holds or</text><text x="850" y="634" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">rejects each candidate.</text><rect x="850" y="660" width="132.375" height="30" rx="15.0" fill="#2C3036"/><text x="862" y="680.4" font-family="Menlo, Consolas, &apos;DejaVu Sans Mono&apos;, monospace" font-size="15" fill="#E6E9ED" text-anchor="start">agent.dawn()</text><rect x="434" y="474" width="340" height="236" rx="16" fill="#1F2125" stroke="#383C43" stroke-width="1.5"/><circle cx="472" cy="518" r="18" fill="#FFAD33"/><text x="472" y="524.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18" font-weight="700" fill="#16181B" text-anchor="middle">5</text><text x="504" y="526" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">Evals</text><g transform="translate(716,498) scale(1.05)" fill="none" stroke="#FFAD33" stroke-width="2.48" stroke-linecap="round" stroke-linejoin="round"><path d="M6 26 A12 12 0 0 1 30 26"/><path d="M18 26 L25 16"/><circle cx="18" cy="26" r="2.2" fill="#FFAD33" stroke="none"/></g><text x="464" y="578" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">Overrides replay as tests. The</text><text x="464" y="606" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">conservative gate must pass</text><text x="464" y="634" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">before release.</text><rect x="464" y="660" width="168.5" height="30" rx="15.0" fill="#2C3036"/><text x="476" y="680.4" font-family="Menlo, Consolas, &apos;DejaVu Sans Mono&apos;, monospace" font-size="15" fill="#E6E9ED" text-anchor="start">agent.evaluate()</text><rect x="48" y="474" width="340" height="236" rx="16" fill="#1F2125" stroke="#383C43" stroke-width="1.5"/><circle cx="86" cy="518" r="18" fill="#4FD486"/><text x="86" y="524.5" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18" font-weight="700" fill="#16181B" text-anchor="middle">6</text><text x="118" y="526" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start">Release</text><g transform="translate(330,498) scale(1.05)" fill="none" stroke="#4FD486" stroke-width="2.48" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12 L18 6 L30 12 L30 26 L18 32 L6 26 Z"/><path d="M6 12 L18 18 L30 12"/><path d="M18 18 L18 32"/></g><text x="78" y="578" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">Promoted capabilities ship in a</text><text x="78" y="606" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">signed release.</text><text x="78" y="634" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19.5" fill="#F1F3F6" text-anchor="start">capabilities.lock lists each one.</text><rect x="78" y="660" width="159.46875" height="30" rx="15.0" fill="#2C3036"/><text x="90" y="680.4" font-family="Menlo, Consolas, &apos;DejaVu Sans Mono&apos;, monospace" font-size="15" fill="#E6E9ED" text-anchor="start">agent.release()</text><line x1="394" y1="274.0" x2="413" y2="274.0" stroke="#FFAD33" stroke-width="3" stroke-linecap="round"/><polygon points="428.0,274.0 412.6,265.2 412.6,282.8" fill="#FFAD33"/><line x1="780" y1="274.0" x2="799" y2="274.0" stroke="#FFAD33" stroke-width="3" stroke-linecap="round"/><polygon points="814.0,274.0 798.6,265.2 798.6,282.8" fill="#FFAD33"/><line x1="990.0" y1="398" x2="990.0" y2="453" stroke="#FFAD33" stroke-width="3" stroke-linecap="round"/><polygon points="990.0,468.0 981.2,452.6 998.8,452.6" fill="#FFAD33"/><text x="974.0" y="440" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="16" fill="#C3C9D1" text-anchor="end">candidates, no authority yet</text><line x1="814" y1="592.0" x2="795" y2="592.0" stroke="#FFAD33" stroke-width="3" stroke-linecap="round"/><polygon points="780.0,592.0 795.4,583.2 795.4,600.8" fill="#FFAD33"/><line x1="428" y1="592.0" x2="409" y2="592.0" stroke="#FFAD33" stroke-width="3" stroke-linecap="round"/><polygon points="394.0,592.0 409.4,583.2 409.4,600.8" fill="#FFAD33"/><line x1="218.0" y1="468" x2="218.0" y2="413" stroke="#4FD486" stroke-width="3" stroke-linecap="round"/><polygon points="218.0,398.0 209.2,413.4 226.8,413.4" fill="#4FD486"/><text x="234.0" y="440" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="16" fill="#C3C9D1" text-anchor="start">the next version starts work</text><line x1="218.0" y1="716" x2="218.0" y2="753" stroke="#EA4700" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"/><polygon points="218.0,764.0 210.8,751.4 225.2,751.4" fill="#EA4700"/><rect x="48" y="768" width="1112" height="92" rx="16" fill="#2D1D17" stroke="#EA4700" stroke-width="2" stroke-dasharray="8 6"/><g transform="translate(76,796) scale(1.0)" fill="none" stroke="#EA4700" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9 L7 15 L13 21"/><path d="M7 15 H22 a8 8 0 0 1 0 16 H14"/></g><text x="130" y="808" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="23" font-weight="700" fill="#EA4700" text-anchor="start">Recall</text><text x="130" y="838" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19" fill="#F1F3F6" text-anchor="start">A capability that proves wrong is recalled, and every release that shipped it is flagged.</text><rect x="981.5625" y="799" width="150.4375" height="30" rx="15.0" fill="#2C3036"/><text x="993.5625" y="819.4" font-family="Menlo, Consolas, &apos;DejaVu Sans Mono&apos;, monospace" font-size="15" fill="#E6E9ED" text-anchor="start">agent.recall()</text><text x="600" y="886" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="16.5" fill="#C3C9D1" text-anchor="middle">Every step appends an envelope to a hash-linked evidence chain, so later edits show up on replay.</text></svg>
