<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arcend" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9900"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="460" rx="18" fill="#1B1C1E" stroke="#3A3C40"/>

  <text x="48" y="56" font-size="29" font-weight="bold" fill="#F5F5F5">One arc, three pieces</text>
  <text x="48" y="84" font-size="17" fill="#B3B8BF">Brightbeam builds the governance layer for expert agents. Each piece answers one question.</text>

  <!-- the arc itself -->
  <path d="M 100 386 C 340 380, 520 330, 680 268 C 840 206, 960 158, 1088 108"
        fill="none" stroke="#FF9900" stroke-width="10" opacity="0.08"/>
  <path d="M 100 386 C 340 380, 520 330, 680 268 C 840 206, 960 158, 1088 108"
        fill="none" stroke="#FF9900" stroke-width="3" marker-end="url(#arcend)"/>

  <!-- station: CHAP -->
  <circle cx="210" cy="378" r="11" fill="#1B1C1E" stroke="#7FA6E8" stroke-width="3"/>
  <line x1="210" y1="367" x2="210" y2="340" stroke="#3A3C40" stroke-width="1.5"/>
  <rect x="94" y="232" width="270" height="108" rx="12" fill="#242528" stroke="#3A3C40"/>
  <text x="112" y="266" font-size="21" font-weight="bold" fill="#7FA6E8" font-family="Consolas, Menlo, monospace">CHAP</text>
  <text x="112" y="291" font-size="16" fill="#E7E9EC">made the work evidenced</text>
  <text x="112" y="312" font-size="15" fill="#8A8F98">hash-linked records of tasks,</text>
  <text x="112" y="330" font-size="15" fill="#8A8F98">artefacts, human decisions</text>
  <text x="210" y="418" font-size="15" fill="#6A7078" text-anchor="middle" font-style="italic">what happened?</text>

  <!-- station: Metis -->
  <circle cx="640" cy="284" r="11" fill="#1B1C1E" stroke="#3FBF71" stroke-width="3"/>
  <line x1="640" y1="295" x2="640" y2="344" stroke="#3A3C40" stroke-width="1.5"/>
  <rect x="518" y="348" width="270" height="88" rx="12" fill="#242528" stroke="#3A3C40"/>
  <text x="536" y="382" font-size="21" font-weight="bold" fill="#3FBF71" font-family="Consolas, Menlo, monospace">Metis</text>
  <text x="536" y="406" font-size="16" fill="#E7E9EC">made the memory governed</text>
  <text x="536" y="426" font-size="15" fill="#8A8F98">governed tacit fragments</text>
  <text x="640" y="260" font-size="15" fill="#6A7078" text-anchor="middle" font-style="italic">what does it know?</text>

  <!-- station: Brevet -->
  <circle cx="1010" cy="140" r="13" fill="#FF9900" stroke="#FF9900" stroke-width="3"/>
  <line x1="1010" y1="153" x2="1010" y2="198" stroke="#3A3C40" stroke-width="1.5"/>
  <rect x="852" y="202" width="300" height="108" rx="12" fill="#242528" stroke="#FF9900" stroke-width="1.5"/>
  <text x="870" y="236" font-size="22" font-weight="bold" fill="#FF9900" font-family="Consolas, Menlo, monospace">Brevet</text>
  <text x="870" y="261" font-size="16" fill="#E7E9EC">makes the learning governed:</text>
  <text x="870" y="282" font-size="16" fill="#E7E9EC">promotable, auditable, revocable</text>
  <text x="870" y="302" font-size="15" fill="#8A8F98">the governed evolution loop</text>
  <text x="966" y="122" font-size="15" fill="#6A7078" text-anchor="end" font-style="italic">how does it change?</text>
</svg>
