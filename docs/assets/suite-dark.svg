<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Where Brevet fits: CHAP, Metis, and Brevet each answer one question"><title>Where Brevet fits: CHAP, Metis, and Brevet each answer one question</title><rect x="1" y="1" width="1198" height="518" rx="22" fill="#16181B" stroke="#383C43" stroke-width="1.5"/><text x="56" y="72" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Where Brevet fits</text><text x="56" y="108" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19" fill="#C3C9D1" text-anchor="start">Three Brightbeam projects, each answering one question about a working agent.</text><rect x="40" y="156" width="350" height="236" rx="16" fill="#1A2232" stroke="#93B6F2" stroke-width="2"/><g transform="translate(66,182) scale(1.05)" fill="none" stroke="#93B6F2" stroke-width="2.48" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="5" width="22" height="26" rx="4"/><path d="M12 13 h12 M12 19 h12 M12 25 h8"/></g><text x="118" y="210" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="27" font-weight="700" fill="#93B6F2" text-anchor="start">CHAP</text><text x="66" y="260" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">What happened?</text><text x="66" y="298" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">Records the work and every review</text><text x="66" y="325" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">decision, in a log anyone can check.</text><rect x="425" y="156" width="350" height="236" rx="16" fill="#17271E" stroke="#4FD486" stroke-width="2"/><g transform="translate(451,182) scale(1.05)" fill="none" stroke="#4FD486" stroke-width="2.48" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="12" r="5"/><path d="M3 30 C3 21 23 21 23 30"/><circle cx="25" cy="11" r="4.5"/><path d="M24 20 C30 20 34 24 34 30"/></g><text x="503" y="210" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="27" font-weight="700" fill="#4FD486" text-anchor="start">Metis</text><text x="451" y="260" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">What do our experts know?</text><text x="451" y="298" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">Captures experts' know-how as</text><text x="451" y="325" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">memory an agent may use, only</text><text x="451" y="352" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">where it holds.</text><rect x="810" y="156" width="350" height="236" rx="16" fill="#2C2416" stroke="#FFAD33" stroke-width="3"/><g transform="translate(836,182) scale(1.05)" fill="none" stroke="#FFAD33" stroke-width="2.48" stroke-linecap="round" stroke-linejoin="round"><path d="M18 4 L30 9 V18 C30 26 24 31 18 33 C12 31 6 26 6 18 V9 Z"/><path d="M12.5 18.5 L16.5 22.5 L24 14"/></g><text x="888" y="210" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="27" font-weight="700" fill="#FFAD33" text-anchor="start">Brevet</text><text x="836" y="260" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">How does the agent change?</text><text x="836" y="298" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">Governs what the agent learns:</text><text x="836" y="325" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">promotion at the dawn gate, signed</text><text x="836" y="352" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">releases and recall.</text><path d="M215.0 398 V430 Q215.0 440 225.0 440 H975.0 Q985.0 440 985.0 430 V413" fill="none" stroke="#93B6F2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="985.0,398.0 977.8,410.6 992.2,410.6" fill="#93B6F2"/><text x="600" y="472" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="17" fill="#C3C9D1" text-anchor="middle">CHAP's review decisions can flow into Brevet as evidence.</text></svg>
