<svg viewBox="0 0 1200 688" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9900"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="688" rx="18" fill="#1B1C1E" stroke="#3A3C40"/>

  <text x="48" y="56" font-size="29" font-weight="bold" fill="#F5F5F5">A new hire&#8217;s learning is governed. An agent&#8217;s is not.</text>
  <text x="48" y="84" font-size="17" fill="#B3B8BF">Brevet holds the agent to the standard you already set for people.</text>

  <!-- ================= panel A: the new hire ================= -->
  <rect x="48" y="112" width="340" height="444" rx="14" fill="#20272A" stroke="#3FBF71" stroke-width="1.5"/>
  <rect x="48" y="112" width="340" height="5" rx="2.5" fill="#3FBF71"/>
  <g stroke="#3FBF71" stroke-width="2.4" stroke-linecap="round" fill="none">
    <circle cx="88" cy="152" r="10"/>
    <path d="M 72 180 a 16 13 0 0 1 32 0"/>
  </g>
  <text x="118" y="150" font-size="18.5" font-weight="bold" fill="#3FBF71">The new hire</text>
  <text x="118" y="171" font-size="14" fill="#9AA0A8">learning fast, under rules</text>

  <g>
    <rect x="72" y="200" width="292" height="70" rx="10" fill="#1B1C1E" stroke="#2E3A33"/>
    <path d="M 90 232 l 6 7 l 13 -14" stroke="#3FBF71" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="228" font-size="15.5" font-weight="bold" fill="#F0F2F4">proposes an SOP change</text>
    <text x="122" y="250" font-size="14" fill="#9AA0A8">a change request, written down</text>

    <rect x="72" y="278" width="292" height="70" rx="10" fill="#1B1C1E" stroke="#2E3A33"/>
    <path d="M 90 310 l 6 7 l 13 -14" stroke="#3FBF71" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="306" font-size="15.5" font-weight="bold" fill="#F0F2F4">a supervisor signs it off</text>
    <text x="122" y="328" font-size="14" fill="#9AA0A8">named, accountable approval</text>

    <rect x="72" y="356" width="292" height="70" rx="10" fill="#1B1C1E" stroke="#2E3A33"/>
    <path d="M 90 388 l 6 7 l 13 -14" stroke="#3FBF71" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="384" font-size="15.5" font-weight="bold" fill="#F0F2F4">the SOP gets a new version</text>
    <text x="122" y="406" font-size="14" fill="#9AA0A8">v12 to v13, history kept</text>

    <rect x="72" y="434" width="292" height="70" rx="10" fill="#1B1C1E" stroke="#2E3A33"/>
    <path d="M 90 466 l 6 7 l 13 -14" stroke="#3FBF71" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="462" font-size="15.5" font-weight="bold" fill="#F0F2F4">bad changes get rolled back</text>
    <text x="122" y="484" font-size="14" fill="#9AA0A8">reversible by design</text>
  </g>
  <text x="218" y="534" font-size="14" fill="#6A7078" text-anchor="middle">this is how trust scales</text>

  <!-- vs badge -->
  <circle cx="409" cy="334" r="17" fill="#2C2D31" stroke="#3A3C40"/>
  <text x="409" y="339" font-size="13" font-weight="bold" fill="#B3B8BF" text-anchor="middle">vs</text>

  <!-- ================= panel B: the agent, unwrapped ================= -->
  <rect x="430" y="112" width="340" height="444" rx="14" fill="#26201E" stroke="#EA4700" stroke-width="1.5"/>
  <rect x="430" y="112" width="340" height="5" rx="2.5" fill="#EA4700"/>
  <g stroke="#FF6A3D" stroke-width="2.4" stroke-linecap="round" fill="none">
    <rect x="458" y="140" width="26" height="20" rx="5"/>
    <line x1="471" y1="140" x2="471" y2="132"/>
    <circle cx="471" cy="130" r="2" fill="#FF6A3D"/>
    <circle cx="466" cy="150" r="1.6" fill="#FF6A3D"/>
    <circle cx="476" cy="150" r="1.6" fill="#FF6A3D"/>
    <path d="M 458 170 h 26"/>
  </g>
  <path d="M 498 134 a 8 8 0 1 0 6 14 a 6.5 6.5 0 0 1 -6 -14 z" fill="#FF6A3D" opacity="0.8"/>
  <text x="518" y="150" font-size="18.5" font-weight="bold" fill="#FF6A3D">The agent, unwrapped</text>
  <text x="518" y="171" font-size="14" fill="#9AA0A8">same behaviour, no rules</text>

  <g>
    <rect x="454" y="200" width="292" height="70" rx="10" fill="#1B1C1E" stroke="#3E2B26"/>
    <g stroke="#FF6A3D" stroke-width="3.2" stroke-linecap="round"><line x1="474" y1="225" x2="489" y2="240"/><line x1="489" y1="225" x2="474" y2="240"/></g>
    <text x="504" y="228" font-size="15.5" font-weight="bold" fill="#F0F2F4">rewrites its rules nightly</text>
    <text x="504" y="250" font-size="14" fill="#9AA0A8">prompts, memory, skills drift</text>

    <rect x="454" y="278" width="292" height="70" rx="10" fill="#1B1C1E" stroke="#3E2B26"/>
    <g stroke="#FF6A3D" stroke-width="3.2" stroke-linecap="round"><line x1="474" y1="303" x2="489" y2="318"/><line x1="489" y1="303" x2="474" y2="318"/></g>
    <text x="504" y="306" font-size="15.5" font-weight="bold" fill="#F0F2F4">nobody signs anything</text>
    <text x="504" y="328" font-size="14" fill="#9AA0A8">no named approver anywhere</text>

    <rect x="454" y="356" width="292" height="70" rx="10" fill="#1B1C1E" stroke="#3E2B26"/>
    <g stroke="#FF6A3D" stroke-width="3.2" stroke-linecap="round"><line x1="474" y1="381" x2="489" y2="396"/><line x1="489" y1="381" x2="474" y2="396"/></g>
    <text x="504" y="384" font-size="15.5" font-weight="bold" fill="#F0F2F4">no versions, no diff</text>
    <text x="504" y="406" font-size="14" fill="#9AA0A8">behaviour just... changes</text>

    <rect x="454" y="434" width="292" height="70" rx="10" fill="#1B1C1E" stroke="#3E2B26"/>
    <g stroke="#FF6A3D" stroke-width="3.2" stroke-linecap="round"><line x1="474" y1="459" x2="489" y2="474"/><line x1="489" y1="459" x2="474" y2="474"/></g>
    <text x="504" y="462" font-size="15.5" font-weight="bold" fill="#F0F2F4">no way to un-learn</text>
    <text x="504" y="484" font-size="14" fill="#9AA0A8">delete it from where, exactly?</text>
  </g>
  <text x="600" y="534" font-size="14" fill="#6A7078" text-anchor="middle">you would never accept this from a person</text>

  <!-- wrap arrow -->
  <line x1="774" y1="334" x2="826" y2="334" stroke="#FF9900" stroke-width="2.5" marker-end="url(#aa)"/>
  <rect x="752" y="348" width="96" height="26" rx="13" fill="#2C2D31" stroke="#3A3C40"/>
  <text x="800" y="365" font-family="Consolas, Menlo, monospace" font-size="12" fill="#FF9900" text-anchor="middle">.wrap()</text>

  <!-- ================= panel C: the agent, in Brevet ================= -->
  <rect x="830" y="112" width="322" height="444" rx="14" fill="#242528" stroke="#FF9900" stroke-width="2"/>
  <rect x="830" y="112" width="322" height="5" rx="2.5" fill="#FF9900"/>
  <g stroke="#FF9900" stroke-width="2.4" stroke-linecap="round" fill="none">
    <rect x="854" y="132" width="40" height="44" rx="9"/>
    <rect x="864" y="146" width="20" height="15" rx="4"/>
    <line x1="874" y1="146" x2="874" y2="139"/>
    <circle cx="874" cy="138" r="1.8" fill="#FF9900"/>
    <circle cx="870" cy="153" r="1.4" fill="#FF9900"/>
    <circle cx="878" cy="153" r="1.4" fill="#FF9900"/>
    <path d="M 866 168 h 16"/>
  </g>
  <text x="908" y="150" font-size="18.5" font-weight="bold" fill="#FF9900">The agent, in Brevet</text>
  <text x="908" y="171" font-size="14" fill="#9AA0A8">the same rules, automatic</text>

  <g>
    <rect x="846" y="200" width="282" height="70" rx="10" fill="#1B1C1E" stroke="#3A3327"/>
    <path d="M 864 232 l 6 7 l 13 -14" stroke="#FF9900" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="890" y="228" font-size="15" font-weight="bold" fill="#F0F2F4">learning becomes candidates</text>
    <text x="890" y="250" font-size="14" fill="#9AA0A8">mined from human overrides</text>

    <rect x="846" y="278" width="282" height="70" rx="10" fill="#1B1C1E" stroke="#3A3327"/>
    <path d="M 864 310 l 6 7 l 13 -14" stroke="#FF9900" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="890" y="306" font-size="15" font-weight="bold" fill="#F0F2F4">a human promotes at dawn</text>
    <text x="890" y="328" font-size="14" fill="#9AA0A8">a signed, recorded decision</text>

    <rect x="846" y="356" width="282" height="70" rx="10" fill="#1B1C1E" stroke="#3A3327"/>
    <path d="M 864 388 l 6 7 l 13 -14" stroke="#FF9900" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="890" y="384" font-size="15" font-weight="bold" fill="#F0F2F4">versioned, locked releases</text>
    <text x="890" y="406" font-size="14" fill="#9AA0A8">capabilities.lock, ed25519</text>

    <rect x="846" y="434" width="282" height="70" rx="10" fill="#1B1C1E" stroke="#3A3327"/>
    <path d="M 864 466 l 6 7 l 13 -14" stroke="#FF9900" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="890" y="462" font-size="15" font-weight="bold" fill="#F0F2F4">recall un-learns, provably</text>
    <text x="890" y="484" font-size="14" fill="#9AA0A8">CVE-style, chain-verified</text>
  </g>
  <text x="991" y="534" font-size="14" fill="#6A7078" text-anchor="middle">trust that scales, for agents</text>

  <!-- footer quote -->
  <rect x="48" y="580" width="1104" height="64" rx="12" fill="#242528" stroke="#3A3C40"/>
  <rect x="48" y="580" width="5" height="64" rx="2.5" fill="#FF9900"/>
  <text x="600" y="607" font-size="16.5" font-style="italic" fill="#E7E9EC" text-anchor="middle">Brevet is the change-request form, the approval meeting, and the version history,</text>
  <text x="600" y="629" font-size="16.5" font-style="italic" fill="#E7E9EC" text-anchor="middle">made cheap enough to be invisible.</text>

  <text x="600" y="670" font-size="13.5" fill="#8A8F98" text-anchor="middle">one standard for both kinds of colleague: nothing ships unsigned, nothing is unrevertable</text>
</svg>
