<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Worked example: one capability from repeated override to dream, dawn, release, and recall"><title>Worked example: one capability from repeated override to dream, dawn, release, and recall</title><rect x="1" y="1" width="1198" height="758" rx="22" fill="#16181B" stroke="#383C43" stroke-width="1.5"/><text x="56" y="72" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">One capability, from override to recall</text><text x="56" y="108" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19" fill="#C3C9D1" text-anchor="start">A quality reviewer at a pharmaceutical plant checks an agent's severity rating for each equipment problem.</text><line x1="104" y1="200" x2="104" y2="614" stroke="#383C43" stroke-width="3" stroke-linecap="round"/><circle cx="104" cy="200" r="27" fill="#1A2232" stroke="#93B6F2" stroke-width="2.5"/><g transform="translate(87,183) scale(0.95)" fill="none" stroke="#93B6F2" stroke-width="2.74" stroke-linecap="round" stroke-linejoin="round"><path d="M8 28 L10 21 L24 7 L29 12 L15 26 Z"/><path d="M21 10 L26 15"/></g><text x="156" y="192" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15" font-weight="700" fill="#93B6F2" text-anchor="start">WEEKS 1 TO 3: WORK AND OVERRIDE</text><text x="156" y="222" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start">The reviewer keeps overriding the same call</text><text x="156" y="252" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">The agent rates pump vibration during cleaning as minor. The reviewer changes</text><text x="156" y="278" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">it to major each time: it is an early sign of seal wear.</text><rect x="874.328125" y="204" width="269.671875" height="38" rx="19" fill="#1A2232" stroke="#93B6F2" stroke-width="1.8"/><text x="1009.1640625" y="229" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="16" font-weight="700" fill="#93B6F2" text-anchor="middle">4 overrides, each with a reason</text><circle cx="104" cy="338" r="27" fill="#231C2F" stroke="#BB9AF0" stroke-width="2.5"/><g transform="translate(87,321) scale(0.95)" fill="none" stroke="#BB9AF0" stroke-width="2.74" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="15" r="9"/><path d="M22 22 L30 30"/><path d="M11 15 h8 M15 11 v8"/></g><text x="156" y="330" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15" font-weight="700" fill="#BB9AF0" text-anchor="start">THAT NIGHT: DREAM</text><text x="156" y="360" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start">Brevet proposes a candidate rule</text><text x="156" y="390" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">The dream cycle finds the same override four times and drafts: vibration during</text><text x="156" y="416" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">cleaning means major. The candidate has no authority yet.</text><rect x="902.8125" y="342" width="241.1875" height="38" rx="19" fill="#231C2F" stroke="#BB9AF0" stroke-width="1.8"/><text x="1023.40625" y="367" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="16" font-weight="700" fill="#BB9AF0" text-anchor="middle">1 candidate, Evidence layer</text><circle cx="104" cy="476" r="27" fill="#17271E" stroke="#4FD486" stroke-width="2.5"/><g transform="translate(87,459) scale(0.95)" fill="none" stroke="#4FD486" stroke-width="2.74" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="13"/><path d="M11.5 18.5 L16 23 L25 13"/></g><text x="156" y="468" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15" font-weight="700" fill="#4FD486" text-anchor="start">NEXT MORNING: DAWN</text><text x="156" y="498" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start">The mission group promotes it</text><text x="156" y="528" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">Release 0.2.0 ships. capabilities.lock names the rule, the overrides behind it</text><text x="156" y="554" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">and who approved it.</text><rect x="956.1875" y="480" width="187.8125" height="38" rx="19" fill="#17271E" stroke="#4FD486" stroke-width="1.8"/><text x="1050.09375" y="505" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="16" font-weight="700" fill="#4FD486" text-anchor="middle">release 0.2.0, signed</text><circle cx="104" cy="614" r="27" fill="#2D1D17" stroke="#EA4700" stroke-width="2.5"/><g transform="translate(87,597) scale(0.95)" fill="none" stroke="#EA4700" stroke-width="2.74" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9 L7 15 L13 21"/><path d="M7 15 H22 a8 8 0 0 1 0 16 H14"/></g><text x="156" y="606" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15" font-weight="700" fill="#FF6A2E" text-anchor="start">MONTHS LATER: RECALL</text><text x="156" y="636" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start">The rule is recalled</text><text x="156" y="666" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">Engineers trace the vibration to a faulty sensor. The mission group recalls the</text><text x="156" y="692" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#F1F3F6" text-anchor="start">rule, and Brevet flags release 0.2.0.</text><rect x="945.53125" y="618" width="198.46875" height="38" rx="19" fill="#2D1D17" stroke="#EA4700" stroke-width="1.8"/><text x="1044.765625" y="643" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="16" font-weight="700" fill="#FF6A2E" text-anchor="middle">recalled, 0.2.0 flagged</text><text x="600" y="734" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="16.5" fill="#C3C9D1" text-anchor="middle">The same lifecycle applies to every kind of capability: prompt rules, skills, tool bindings and eval cases.</text></svg>
