<svg viewBox="0 0 1200 512" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="la" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9900"/>
    </marker>
    <marker id="lr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EA4700"/>
    </marker>
    <marker id="lb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7FA6E8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="512" rx="18" fill="#1B1C1E" stroke="#3A3C40"/>

  <text x="48" y="52" font-size="28" font-weight="bold" fill="#F5F5F5">Authority is granted, never grabbed</text>
  <text x="48" y="78" font-size="16.5" fill="#B3B8BF">one capability object for everything an agent can learn · one lifecycle · one revocation mechanism</text>

  <!-- entry arrows -->
  <line x1="110" y1="114" x2="110" y2="156" stroke="#7FA6E8" stroke-width="2" marker-end="url(#lb)"/>
  <text x="122" y="126" font-size="14.5" fill="#7FA6E8">endogenous candidates (dream cycle)</text>
  <line x1="252" y1="138" x2="252" y2="156" stroke="#7FA6E8" stroke-width="2" marker-end="url(#lb)"/>
  <text x="264" y="148" font-size="14.5" fill="#7FA6E8">compiled eval cases (your overrides)</text>

  <!-- EVIDENCE -->
  <rect x="48" y="160" width="300" height="174" rx="14" fill="#232430" stroke="#7FA6E8" stroke-width="2"/>
  <text x="72" y="194" font-size="20" font-weight="bold" fill="#7FA6E8" letter-spacing="1">EVIDENCE</text>
  <text x="72" y="220" font-size="15.5" fill="#E7E9EC">quarantined, zero authority</text>
  <text x="72" y="241" font-size="15.5" fill="#E7E9EC">for review, never for behaviour</text>
  <rect x="72" y="258" width="258" height="32" rx="8" fill="#1B1C1E" stroke="#3A3C40"/>
  <text x="86" y="280" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#B3B8BF">never appears in a lockfile</text>
  <text x="72" y="316" font-size="14" fill="#8A8F98">rejection is not deletion</text>

  <!-- gate 1 -->
  <text x="408" y="216" font-size="15" font-weight="bold" fill="#FF9900" text-anchor="middle">dawn gate</text>
  <line x1="352" y1="238" x2="464" y2="238" stroke="#FF9900" stroke-width="2.5" marker-end="url(#la)"/>
  <text x="408" y="260" font-size="13" fill="#B3B8BF" text-anchor="middle">named human or</text>
  <text x="408" y="274" font-size="13" fill="#B3B8BF" text-anchor="middle">mission group</text>

  <!-- ADVISORY -->
  <rect x="468" y="160" width="300" height="174" rx="14" fill="#242528" stroke="#FF9900" stroke-width="2"/>
  <text x="492" y="194" font-size="20" font-weight="bold" fill="#FF9900" letter-spacing="1">ADVISORY</text>
  <text x="492" y="220" font-size="15.5" fill="#E7E9EC">may inform suggested actions</text>
  <text x="492" y="241" font-size="15.5" fill="#E7E9EC">conditions first, exclusions veto</text>
  <rect x="492" y="258" width="258" height="32" rx="8" fill="#1B1C1E" stroke="#3A3C40"/>
  <text x="506" y="280" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#3FBF71">goes into capabilities.lock</text>
  <text x="492" y="316" font-size="14" fill="#8A8F98">brevet rank: provisional, signed</text>

  <!-- gate 2 -->
  <text x="828" y="216" font-size="15" font-weight="bold" fill="#FF9900" text-anchor="middle">second gate</text>
  <line x1="772" y1="238" x2="884" y2="238" stroke="#FF9900" stroke-width="2.5" marker-end="url(#la)"/>
  <text x="828" y="260" font-size="13" fill="#B3B8BF" text-anchor="middle">mission review +</text>
  <text x="828" y="274" font-size="13" fill="#B3B8BF" text-anchor="middle">change control</text>

  <!-- CONTROLLED -->
  <rect x="888" y="160" width="264" height="174" rx="14" fill="#20272A" stroke="#3FBF71" stroke-width="2"/>
  <text x="912" y="194" font-size="20" font-weight="bold" fill="#3FBF71" letter-spacing="1">CONTROLLED</text>
  <text x="912" y="220" font-size="15.5" fill="#E7E9EC">may shape act-class tools</text>
  <text x="912" y="241" font-size="15.5" fill="#E7E9EC">carries reviewer provenance</text>
  <rect x="912" y="258" width="222" height="32" rx="8" fill="#1B1C1E" stroke="#3A3C40"/>
  <text x="926" y="280" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#B3B8BF">change control referenced</text>

  <!-- recall lane -->
  <path d="M 618 334 C 618 350, 604 356, 588 364" fill="none" stroke="#EA4700" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#lr)"/>
  <path d="M 1020 334 C 1020 364, 850 362, 714 380" fill="none" stroke="#EA4700" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#lr)"/>
  <rect x="240" y="368" width="466" height="54" rx="10" fill="#26201E" stroke="#EA4700" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="264" y="391" font-size="16" font-weight="bold" fill="#FF7A45">WITHDRAWN, recalled</text>
  <text x="264" y="411" font-size="14.5" fill="#D8B4AA">fails releasable forever, affected releases flagged</text>

  <!-- invariant strip -->
  <rect x="48" y="442" width="1104" height="52" rx="10" fill="#242528" stroke="#3A3C40"/>
  <text x="600" y="464" font-size="15.5" fill="#E7E9EC" text-anchor="middle">no self-authorisation: approvers in agent:* / model:* / dream:* namespaces are rejected</text>
  <text x="600" y="483" font-size="14" fill="#8A8F98" text-anchor="middle">endogenous candidates can never be promoted by the process that proposed them</text>
</svg>
