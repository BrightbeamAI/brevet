<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Brevet wraps the agent you already have and keeps the records around it"><title>Brevet wraps the agent you already have and keeps the records around it</title><rect x="1" y="1" width="1198" height="638" rx="22" fill="#16181B" stroke="#383C43" stroke-width="1.5"/><text x="56" y="72" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Brevet wraps the agent you already have</text><text x="56" y="108" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19" fill="#C3C9D1" text-anchor="start">Your framework keeps running the agent. Brevet keeps the manifest, the evidence and the releases around it.</text><rect x="300" y="166" width="860" height="392" rx="24" fill="#1F2125" stroke="#FF6A2E" stroke-width="2.6"/><rect x="420" y="262" width="620" height="200" rx="18" fill="#24272C" stroke="#383C43" stroke-width="1.8"/><g transform="translate(712.0,284) scale(1.0)" fill="none" stroke="#FFFFFF" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="12" width="22" height="17" rx="5"/><line x1="18" y1="5" x2="18" y2="12"/><circle cx="18" cy="4" r="2"/><circle cx="13.5" cy="20.5" r="2" fill="#FFFFFF" stroke="none"/><circle cx="22.5" cy="20.5" r="2" fill="#FFFFFF" stroke="none"/></g><text x="730.0" y="354" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Your agent, unchanged</text><rect x="438.4453125" y="378" width="111.40625" height="32" rx="16" fill="#2C3036"/><text x="494.1484375" y="399" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15.5" font-weight="700" fill="#E6E9ED" text-anchor="middle">LangGraph</text><rect x="557.8515625" y="378" width="81.171875" height="32" rx="16" fill="#2C3036"/><text x="598.4375" y="399" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15.5" font-weight="700" fill="#E6E9ED" text-anchor="middle">CrewAI</text><rect x="647.0234375" y="378" width="93.59375" height="32" rx="16" fill="#2C3036"/><text x="693.8203125" y="399" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15.5" font-weight="700" fill="#E6E9ED" text-anchor="middle">AutoGen</text><rect x="748.6171875" y="378" width="166.859375" height="32" rx="16" fill="#2C3036"/><text x="832.046875" y="399" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15.5" font-weight="700" fill="#E6E9ED" text-anchor="middle">Claude Agent SDK</text><rect x="923.4765625" y="378" width="98.078125" height="32" rx="16" fill="#FFAD33"/><text x="972.515625" y="399" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15.5" font-weight="700" fill="#16181B" text-anchor="middle">and more</text><text x="730.0" y="440" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="16" fill="#C3C9D1" text-anchor="middle">or any Python function</text><rect x="320" y="128" width="320" height="76" rx="14" fill="#24272C" stroke="#FFAD33" stroke-width="2"/><g transform="translate(336,148) scale(1.0)" fill="none" stroke="#FFAD33" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 H22 L28 11 V31 H9 Z"/><path d="M22 5 V11 H28"/><path d="M13 18 h11 M13 24 h11"/></g><text x="384" y="161" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Signed manifest</text><text x="384" y="186" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15.5" fill="#C3C9D1" text-anchor="start">the harness as a signed file</text><rect x="820" y="128" width="320" height="76" rx="14" fill="#24272C" stroke="#FFAD33" stroke-width="2"/><g transform="translate(836,148) scale(1.0)" fill="none" stroke="#FFAD33" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="5" width="22" height="26" rx="4"/><path d="M12 13 h12 M12 19 h12 M12 25 h8"/></g><text x="884" y="161" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Evidence chain</text><text x="884" y="186" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15.5" fill="#C3C9D1" text-anchor="start">every step, hash-linked</text><rect x="320" y="520" width="320" height="76" rx="14" fill="#24272C" stroke="#FFAD33" stroke-width="2"/><g transform="translate(336,540) scale(1.0)" fill="none" stroke="#FFAD33" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="12" r="5"/><path d="M3 30 C3 21 23 21 23 30"/><circle cx="25" cy="11" r="4.5"/><path d="M24 20 C30 20 34 24 34 30"/></g><text x="384" y="553" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Dawn gate</text><text x="384" y="578" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15.5" fill="#C3C9D1" text-anchor="start">named humans promote</text><rect x="820" y="520" width="320" height="76" rx="14" fill="#24272C" stroke="#FFAD33" stroke-width="2"/><g transform="translate(836,540) scale(1.0)" fill="none" stroke="#FFAD33" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12 L18 6 L30 12 L30 26 L18 32 L6 26 Z"/><path d="M6 12 L18 18 L30 12"/><path d="M18 18 L18 32"/></g><text x="884" y="553" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">capabilities.lock</text><text x="884" y="578" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15.5" fill="#C3C9D1" text-anchor="start">what it knows, who approved it</text><rect x="40" y="336.0" width="216.21875" height="52" rx="14" fill="#24272C" stroke="#FFAD33" stroke-width="2"/><text x="148.109375" y="368.0" font-family="Menlo, Consolas, &apos;DejaVu Sans Mono&apos;, monospace" font-size="17" fill="#FFAD33" text-anchor="middle">brevet.wrap(agent)</text><line x1="264.21875" y1="362.0" x2="279" y2="362.0" stroke="#FFAD33" stroke-width="3" stroke-linecap="round"/><polygon points="294.0,362.0 278.6,353.2 278.6,370.8" fill="#FFAD33"/></svg>
