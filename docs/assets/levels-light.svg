<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="The authority ladder: Evidence, Advisory, Controlled, and Recalled"><title>The authority ladder: Evidence, Advisory, Controlled, and Recalled</title><rect x="1" y="1" width="1198" height="598" rx="22" fill="#FFFFFF" stroke="#D9DDE3" stroke-width="1.5"/><text x="56" y="72" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="34" font-weight="700" fill="#12161B" text-anchor="start">The authority ladder</text><text x="56" y="108" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19" fill="#58626D" text-anchor="start">Every capability enters at Evidence. Only a recorded human decision raises its authority.</text><rect x="40" y="158" width="284" height="236" rx="16" fill="#EDF2FB" stroke="#2F62B8" stroke-width="2.4"/><text x="66" y="206" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="26" font-weight="700" fill="#2F62B8" text-anchor="start">Evidence</text><text x="66" y="238" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19" font-weight="700" fill="#12161B" text-anchor="start">Candidates only</text><text x="66" y="276" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#27303A" text-anchor="start">No operational authority.</text><text x="66" y="303" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#27303A" text-anchor="start">Humans can inspect it; evals</text><text x="66" y="330" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#27303A" text-anchor="start">can test it.</text><rect x="462" y="158" width="284" height="236" rx="16" fill="#FFF4E5" stroke="#B86A00" stroke-width="2.4"/><text x="488" y="206" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="26" font-weight="700" fill="#B86A00" text-anchor="start">Advisory</text><text x="488" y="238" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19" font-weight="700" fill="#12161B" text-anchor="start">Shapes drafts</text><text x="488" y="276" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#27303A" text-anchor="start">May inform what the agent</text><text x="488" y="303" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#27303A" text-anchor="start">drafts. A human still checks</text><text x="488" y="330" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#27303A" text-anchor="start">each result.</text><rect x="884" y="158" width="284" height="236" rx="16" fill="#EAF6EF" stroke="#1C8A4E" stroke-width="2.4"/><text x="910" y="206" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="26" font-weight="700" fill="#1C8A4E" text-anchor="start">Controlled</text><text x="910" y="238" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="19" font-weight="700" fill="#12161B" text-anchor="start">Drives actions</text><text x="910" y="276" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#27303A" text-anchor="start">May drive actions directly,</text><text x="910" y="303" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#27303A" text-anchor="start">with no human checking</text><text x="910" y="330" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="18.5" fill="#27303A" text-anchor="start">each result.</text><line x1="332" y1="290.0" x2="439" y2="290.0" stroke="#D64500" stroke-width="3.2" stroke-linecap="round"/><polygon points="454.0,290.0 438.6,281.2 438.6,298.8" fill="#D64500"/><text x="393.0" y="252.0" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15" fill="#58626D" text-anchor="middle">promoted at the</text><text x="393.0" y="273.0" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15.5" font-weight="700" fill="#12161B" text-anchor="middle">dawn gate</text><line x1="754" y1="290.0" x2="861" y2="290.0" stroke="#D64500" stroke-width="3.2" stroke-linecap="round"/><polygon points="876.0,290.0 860.6,281.2 860.6,298.8" fill="#D64500"/><text x="815.0" y="252.0" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15" fill="#58626D" text-anchor="middle">promoted by the</text><text x="815.0" y="273.0" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="15.5" font-weight="700" fill="#12161B" text-anchor="middle">mission group</text><rect x="280" y="452" width="640" height="84" rx="16" fill="#FDEEE7" stroke="#D64500" stroke-width="2" stroke-dasharray="8 6"/><g transform="translate(304,476) scale(1.0)" fill="none" stroke="#D64500" stroke-width="2.60" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9 L7 15 L13 21"/><path d="M7 15 H22 a8 8 0 0 1 0 16 H14"/></g><text x="356" y="489" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="21" font-weight="700" fill="#D64500" text-anchor="start">Recalled</text><text x="356" y="516" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="17" fill="#27303A" text-anchor="start">Leaves future releases; every release that shipped it is flagged.</text><line x1="604.0" y1="400" x2="604.0" y2="437" stroke="#D64500" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 6"/><polygon points="604.0,448.0 596.8,435.4 611.2,435.4" fill="#D64500"/><path d="M1026.0 400 V484.0 Q1026.0 494.0 1016.0 494.0 H935" fill="none" stroke="#D64500" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><polygon points="924.0,494.0 936.6,486.8 936.6,501.2" fill="#D64500"/><text x="600" y="574" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="17" fill="#58626D" text-anchor="middle">Approver identities in the agent:, model: and dream: namespaces are rejected.</text></svg>
